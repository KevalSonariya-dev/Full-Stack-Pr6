services:
  # ==========================================
  # 1. Database Service (Official MongoDB)
  # ==========================================
  mongodb:
    image: mongo:latest
    container_name: task-manager-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # ==========================================
  # 2. Backend Service (Node/Express API)
  # ==========================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task_manager
      - JWT_SECRET=your_secure_jwt_secret
    depends_on:
      - mongodb
    networks:
      - app-network

  # ==========================================
  # 3. Frontend Service (React / Vite)
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# ==========================================
# Named Volumes (Supplementary Requirement)
# Data persists across container restarts
# ==========================================
volumes:
  mongo-data:
    driver: local

# ==========================================
# Bridge Network for Inter-Container Communication
# Resolves container names (e.g., 'mongodb') via Docker DNS
# ==========================================
networks:
  app-network:
    driver: bridge
